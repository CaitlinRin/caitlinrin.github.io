<script>
	let slideIndex = 0;
	stopSlides();
	startSlides();
	let slideshow = document.getElementsByClassName("mySlides");
	//slideshow.addEventListener("mouseover", startSlides);
	//slideshow.addEventListener("mouseout", stopSlides);
	
	//slideshow.onmouseover = startSlides();
	//slideshow.onmouseout = stopSlides();
	
	var stop = true;

	function showSlides() {
	if(stop == false)
	{
	let i = 0;
	let slides = document.getElementsByClassName("mySlides");
	for (i = 0; i < slides.length; i++) {
		slides[i].style.display = "none";
	}
	slideIndex++;
	if (slideIndex > slides.length) {slideIndex = 1}
	slides[slideIndex-1].style.display = "block";
	
		setTimeout(showSlides, 2000); // Change image every 2 seconds
	}
	}
	
	function stopSlides() {
		let slides = document.getElementsByClassName("mySlides");	
		let i = 0;
		for (i = 0; i < slides.length; i++) {
			slides[i].style.display = "none";
		}
		slides[0].style.display = "block";
		stop = true;
	}
	
	function startSlides() {
		stop = false;
		//slides[0].style.display = "none";
		showSlides();
	}
</script>
